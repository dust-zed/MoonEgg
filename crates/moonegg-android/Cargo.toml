[package]
name = "moonegg-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
moonegg-core = { path = "../moonegg-core" }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-33", "media"] }
ndk-sys = { version = "0.6.0", features = ["media"] }
thiserror.workspace = true
libc = "0.2"
